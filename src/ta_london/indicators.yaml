# Indicator dictionary. One entry per indicator: name, label, definition, unit, source_id, caveats.
# Share indicators (_share, _share_of_known) are derived automatically in indicators.py.
- name: ta_households
  label: Households in temporary accommodation
  definition: 'Households in temporary accommodation: accommodation arranged by the council pending enquiries
    or after accepting a homelessness duty (MHCLG note 34).'
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend).
- name: households_in_area
  label: Households in the area (thousands)
  definition: 'Household projection MHCLG uses as the denominator for its per-1,000 rate (note 5: 2022-based
    household projections).'
  unit: thousand_households
  source_id: mhclg_la_detailed_2026q1
  caveats: A projection, not a count. Used only as MHCLG's denominator.
- name: ta_households_per_1000
  label: Households in TA per 1,000 households
  definition: 'MHCLG''s own published rate: households in TA divided by the household projection, per
    1,000.'
  unit: per_1000_households
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend). Rates use MHCLG's published denominator.
    Not recalculated here.
- name: ta_households_with_children
  label: Households in TA with dependent children
  definition: Households in TA that include dependent children.
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend). Differs by 1 from the TA2 composition
    total for Newham (rounding in the source).
- name: ta_children
  label: Children in TA
  definition: Number of children in households in TA (TA1).
  unit: children
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend). Not the same count as under-18s in TA8;
    the two tables are not reconciled.
- name: ta_bnb_with_children
  label: Households with children in B&B
  definition: Households with children in bed and breakfast hotels, including shared annexes.
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend).
- name: ta_bnb_with_children_over_6_weeks
  label: Households with children in B&B for more than 6 weeks
  definition: Households with children resident in B&B for more than six weeks. The statutory limit for
    families with children is six weeks.
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend). Check the exact exemptions in the source
    file before quoting as a breach.
- name: ta_households_out_of_area
  label: Households in TA out of area
  definition: Households recorded as out of area (placed outside their own council).
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: 'Snapshot at 31 March 2026 (one quarter, not a trend). Note 36: may include households owed
    a duty with no accommodation secured, so can slightly overstate placements.'
- name: ta_households_duty_owed_no_accommodation
  label: Households owed a duty, no accommodation secured
  definition: Households owed a main duty but still in the accommodation they were accepted from, or making
    their own arrangements ('homeless at home').
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend).
- name: ta_households_out_of_area_share
  label: Share of TA households placed out of area
  definition: Households recorded as out of area divided by all households in TA, as a percentage.
  unit: percent
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend). The out-of-area count (note 36) may
    include households owed a duty with no accommodation secured, so the share can slightly overstate
    placements.
- name: ta_households_by_accommodation_type
  label: Households in TA by accommodation type
  definition: 'All households in TA split by type: B&B, nightly paid self-contained, hostel, private sector,
    council or housing association stock, other.'
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend).
- name: ta_households_by_composition
  label: Households in TA by household composition
  definition: TA households split by household makeup. One-adult families split by sex of the adult.
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend). 'other_or_not_known' includes categories
    previously folded into not known (note 38).
- name: ta_households_by_duty
  label: Households in TA by duty owed
  definition: TA households split by the duty under which they are accommodated (s193 main duty, interim,
    s189B, duty ended, not classifiable).
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend). Interim covers pending enquiries, intentionally
    homeless, review or appeal, and awaiting referral.
- name: ta_households_by_age_of_main_applicant
  label: Households in TA by age of main applicant
  definition: TA households split by the age band of the main applicant.
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend).
- name: ta_households_by_ethnicity
  label: Households in TA by ethnicity of main applicant (groups)
  definition: TA households split by ethnic group of the main applicant.
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend). Ethnicity is not known for a large share
    of households (30% in Newham). Compare with the borough population mix before reading anything into
    over- or under-representation.
- name: ta_households_by_ethnicity_detail
  label: Households in TA by ethnicity of main applicant (detailed)
  definition: As the group version, with the detailed categories.
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend). Small counts. Same not-known caveat as
    the group version.
- name: ta_families_by_accommodation_type
  label: Families in TA by accommodation type
  definition: Households with dependent children in TA split by accommodation type (TA4).
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend).
- name: ta_families_length_of_stay
  label: Families in TA by accommodation type and length of stay
  definition: Households with dependent children in TA, by accommodation type and time spent in TA. Breakdown
    is <type>__<length band>.
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend). Counts current stayers only, so it describes
    who is in TA now, not completed stays.
- name: ta_length_of_stay_median_days
  label: Median length of stay in TA (days)
  definition: Median days in TA for households still in TA at quarter end, by accommodation type (TA7).
  unit: days
  source_id: mhclg_la_detailed_2026q1
  caveats: 'Snapshot at 31 March 2026 (one quarter, not a trend). Note 45: only households still in TA
    at the quarter end are counted. Zero values in the source (no households of that type) are treated
    as missing.'
- name: ta_length_of_stay_mean_days
  label: Mean length of stay in TA (days)
  definition: Mean days in TA for households still in TA at quarter end, by accommodation type (TA7).
  unit: days
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend). Same caveats as the median. Means are
    pulled up by very long stays.
- name: ta_children_under_18
  label: People aged under 18 in TA
  definition: Number of people aged under 18 in TA (TA8).
  unit: children
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend). Not the same count as 'children in TA'
    in TA1.
- name: ta_children_by_age
  label: People aged under 18 in TA by single year of age
  definition: TA8 split by age 0 to 17.
  unit: children
  source_id: mhclg_la_detailed_2026q1
  caveats: Snapshot at 31 March 2026 (one quarter, not a trend).
- name: housing_register_households
  label: Households on the housing register (waiting list)
  definition: Households on the local authority housing register at the reference date (Live Table 600).
    2012 to 2025.
  unit: households
  source_id: mhclg_lt600_2025
  caveats: 'Table note 1: a register is not the same as households waiting for social housing; councils
    review registers at different times and some households are on more than one. Figures flagged ''estimated''
    were imputed by MHCLG. The 2018 value (and earlier) is at 1 April. Large year-on-year changes (for
    example Brent 2020 to 2021, Lambeth 2024 to 2025) look like register changes, so compare boroughs
    with care.'
- name: social_lettings_total
  label: New social housing lettings (all types)
  definition: All new social housing lettings (social rent, affordable rent, intermediate rent; general
    needs and supported; councils and housing associations) in the financial year (CORE Table 1d).
  unit: lettings
  source_id: mhclg_core_tenancies_2425
  caveats: CORE data is unweighted and as reported. In 2024/25 Barnet, Camden, Greenwich and Wandsworth
    did not submit CORE data (table note 10), so their figures are under-counts and rankings that include
    them are unreliable.
- name: social_lettings_by_type
  label: New social housing lettings by tenure and landlord
  definition: Lettings split by tenure (SR social rent, AR affordable rent, IR intermediate rent), need
    (general needs or supported) and landlord (LA or PRP).
  unit: lettings
  source_id: mhclg_core_tenancies_2425
  caveats: CORE data is unweighted and as reported. In 2024/25 Barnet, Camden, Greenwich and Wandsworth
    did not submit CORE data (table note 10), so their figures are under-counts and rankings that include
    them are unreliable. Local authority lettings columns are undercounted for councils that did not submit.
- name: social_relet_rent_weekly
  label: Average weekly social rent for re-lets
  definition: Geometric mean weekly rent for social housing re-lets in the year (CORE Table 1e).
  unit: gbp_per_week
  source_id: mhclg_core_tenancies_2425
  caveats: 2024/25 only. Geometric means (note 15). CORE data is unweighted and as reported. In 2024/25
    Barnet, Camden, Greenwich and Wandsworth did not submit CORE data (table note 10), so their figures
    are under-counts and rankings that include them are unreliable.
- name: market_rent_weekly
  label: Average weekly market rent
  definition: Geometric mean weekly private market rent for the same area (ONS Price Index of Private
    Rents, as used in CORE Table 1e).
  unit: gbp_per_week
  source_id: mhclg_core_tenancies_2425
  caveats: 2024/25 only. Not matched by bedroom size to the social rent.
- name: social_rent_pct_of_market_rent
  label: Social re-let rent as % of market rent
  definition: Average social re-let rent divided by average market rent, as published in CORE Table 1e.
  unit: percent
  source_id: mhclg_core_tenancies_2425
  caveats: 2024/25 only. Averages are not matched by property size.
- name: social_relets
  label: Social housing re-lets
  definition: New social housing re-lets in the year (CORE Table 1e).
  unit: lettings
  source_id: mhclg_core_tenancies_2425
  caveats: 2024/25 only. CORE data is unweighted and as reported. In 2024/25 Barnet, Camden, Greenwich
    and Wandsworth did not submit CORE data (table note 10), so their figures are under-counts and rankings
    that include them are unreliable.
- name: social_stock_1_april
  label: Total social housing stock at 1 April
  definition: Social stock from the Regulator's data return and MHCLG Live Table 116, as used in CORE
    Table 1e.
  unit: homes
  source_id: mhclg_core_tenancies_2425
  caveats: 2024/25 only.
- name: social_relet_rate
  label: Share of social stock re-let
  definition: Re-lets as a percentage of social stock (churn), CORE Table 1e.
  unit: percent
  source_id: mhclg_core_tenancies_2425
  caveats: 2024/25 only. Under-counted for councils that did not submit CORE data (Barnet, Camden, Greenwich,
    Wandsworth), so their low rates are not reliable.
