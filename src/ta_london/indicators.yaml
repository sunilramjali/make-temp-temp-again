# Indicator dictionary. One entry per indicator: name, label, definition, unit, source_id, caveats.
# definition and caveats are written in plain English for the dashboard's readers.
# Optional: source_detail (table codes, note numbers and method detail, for checking against the
# source), series_break (plain text) and series_break_date (where trend charts draw a break marker).
# Share indicators (_share, _share_of_known) are derived automatically in indicators.py.
- name: ta_households
  label: Households in temporary accommodation
  definition: "Households living in temporary accommodation arranged by the council. This covers
    households waiting for the council to decide on their case, and households the council has
    agreed it must help."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time."
  source_detail: "MHCLG detailed local authority tables, TA1. Definition from MHCLG note 34."
- name: households_in_area
  label: Households in the area (thousands)
  definition: "The estimated number of households in the borough. The government uses it to work
    out how many households per 1,000 are in temporary accommodation."
  unit: thousand_households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is an estimate (a projection from earlier data), not a count. It is used only to
    work out rates."
  source_detail: "MHCLG note 5: 2022-based household projections, used as the denominator for the
    per-1,000 rate."
- name: ta_households_per_1000
  label: Households in TA per 1,000 households
  definition: "Out of every 1,000 households in the borough, how many are in temporary accommodation.
    This lets big and small boroughs be compared fairly. The government publishes this rate itself."
  unit: per_1000_households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time. We show the
    government's published rate as it is, without recalculating it."
  source_detail: "MHCLG TA1: households in TA divided by the 2022-based household projection (note 5),
    per 1,000."
- name: ta_households_with_children
  label: Families with children in TA
  definition: "Households in temporary accommodation that include children who depend on them."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time. For Newham it
    differs by 1 from the total in the household-type table, because of rounding in the source."
  source_detail: "MHCLG TA1 (households with dependent children). Differs by 1 from the TA2
    composition total for Newham."
- name: ta_children
  label: Children in TA
  definition: "The number of children living in households in temporary accommodation."
  unit: children
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time. The government also
    publishes a second, separate count of under-18s in temporary accommodation. The two differ
    slightly and we show both as published."
  source_detail: "MHCLG TA1. Not reconciled with the TA8 count of people aged under 18."
- name: ta_bnb_with_children
  label: Families with children in B&B
  definition: "Families with children staying in bed and breakfast hotels, including annexes where
    facilities are shared."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time."
  source_detail: "MHCLG TA1, B&B including shared annexes."
- name: ta_bnb_with_children_over_6_weeks
  label: Families with children in B&B for more than 6 weeks
  definition: "Families with children who have stayed in a B&B for more than six weeks. By law,
    families with children should not stay in a B&B for longer than six weeks."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time. There are some legal
    exceptions to the six-week limit, so check the source before calling a figure a breach of the
    law."
  source_detail: "MHCLG TA1. Statutory six-week limit for families with children in B&B."
- name: ta_households_out_of_area
  label: Households in TA housed outside their borough
  definition: "Households in temporary accommodation that the council has housed outside its own
    borough."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time. It may also include
    a few households the council must help but hasn't yet found a place for, so it can slightly
    overstate the number housed elsewhere."
  source_detail: "MHCLG TA1, out-of-area households. Note 36: may include households owed a duty with
    no accommodation secured."
- name: ta_households_duty_owed_no_accommodation
  label: Households the council must help but hasn't yet housed
  definition: "Households the council has agreed it must house, who are still living where they were
    when they applied, or making their own arrangements. This is sometimes called being 'homeless at
    home'."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time."
  source_detail: "MHCLG TA1: main duty owed, no accommodation secured."
- name: ta_households_out_of_area_share
  label: Share of households in TA housed outside their borough
  definition: "Of all households in temporary accommodation, the percentage housed outside the
    council's own borough."
  unit: percent
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time. The count of
    households housed elsewhere may include a few who haven't yet been found a place, so the share can
    be slightly too high."
  source_detail: "MHCLG TA1: out-of-area count (note 36) divided by total households in TA."
- name: ta_households_pct_of_households
  label: Share of all households living in TA
  definition: "Of all households in the borough, the percentage living in temporary accommodation."
  unit: percent
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time. It is the same
    figure as the 'per 1,000 households' rate divided by 10. The number of households in the borough
    is an estimate, not a count."
  source_detail: "MHCLG TA1: households in TA divided by the 2022-based household projection (note 5)."
- name: ta_households_with_children_pct_of_households
  label: Families with children in TA, as a share of all households
  definition: "Families with children in temporary accommodation, as a percentage of all households in
    the borough (of any type)."
  unit: percent
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026. It compares families in TA with all
    households, not with all families, because there is no count of families with children in the
    data. So it is not 'the share of families who are in TA'."
  source_detail: "MHCLG TA1 households with dependent children divided by the household projection."
- name: ta_households_by_accommodation_type
  label: Households in TA by type of home
  definition: "All households in temporary accommodation, split by the type of home: B&B hotel,
    nightly-paid self-contained home, hostel, private rented home leased by the council, council or
    housing association home, or other."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time."
  source_detail: "MHCLG TA1, accommodation type columns."
- name: ta_households_by_composition
  label: Households in TA by type of household
  definition: "Households in temporary accommodation, split by who lives in them, for example single
    parents, couples with children, or adults only. Single parents are split by whether the parent is
    a woman or a man."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time. 'Other or not known'
    now includes some groups that used to be counted as 'not known'."
  source_detail: "MHCLG TA2. Note 38 on the 'other or not known' category."
- name: ta_households_by_duty
  label: Households in TA by legal duty
  definition: "Households in temporary accommodation, split by why the council is housing them: the
    main duty (the council must house them until it can offer a settled home), a short-term stay while
    the council looks into their case, an emergency stay while the council helps them find a home, a
    duty that has already ended, or unclear."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time. The short-term group
    includes households waiting for a decision, those judged to have made themselves homeless, those
    asking for a decision to be reviewed or appealed, and those waiting to be referred to another
    council."
  source_detail: "MHCLG TA3: s193 main duty, interim (pending enquiries, intentionally homeless, review
    or appeal, awaiting referral), s189B relief, duty ended, not classifiable."
- name: ta_households_by_age_of_main_applicant
  label: Households in TA by age of the person who applied
  definition: "Households in temporary accommodation, split by the age group of the person who applied
    for help."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time."
  source_detail: "MHCLG TA, age band of main applicant."
- name: ta_households_by_ethnicity
  label: Households in TA by ethnicity (main groups)
  definition: "Households in temporary accommodation, split by the ethnic group of the person who
    applied for help."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time. Ethnicity isn't
    recorded for many households (30% in Newham). To say whether a group is over- or
    under-represented, these figures would need to be compared with the ethnic mix of the borough as
    a whole."
  source_detail: "MHCLG TA, ethnic group of main applicant."
- name: ta_households_by_ethnicity_detail
  label: Households in TA by ethnicity (detailed groups)
  definition: "The same as the main groups, split into more detailed ethnic groups."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time. Many of the numbers
    are small. Ethnicity isn't recorded for many households, as with the main groups."
  source_detail: "MHCLG TA, detailed ethnicity of main applicant."
- name: ta_families_by_accommodation_type
  label: Families with children in TA by type of home
  definition: "Families with children in temporary accommodation, split by the type of home they live
    in."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time."
  source_detail: "MHCLG TA4."
- name: ta_families_length_of_stay
  label: Families with children in TA by type of home and time spent there
  definition: "Families with children in temporary accommodation, split by the type of home and how long
    they have been in temporary accommodation."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time. It only counts
    families still in temporary accommodation on that day, so it shows how long current families have
    been there so far, not how long a stay usually lasts in total."
  source_detail: "MHCLG TA4/TA7 length-of-stay bands. Breakdown is <type>__<length band>."
- name: ta_length_of_stay_median_days
  label: Typical (median) number of days in TA
  definition: "The typical number of days households have spent in temporary accommodation so far, for
    each type of home. Half of households have been there longer than this, and half for less time."
  unit: days
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time. It only counts
    households still in temporary accommodation on that day. Where the source shows zero (no
    households of that type), we show no figure."
  source_detail: "MHCLG TA7, median days. Note 45: only households still in TA at quarter end. Zeros
    treated as missing."
- name: ta_length_of_stay_mean_days
  label: Average (mean) number of days in TA
  definition: "The average number of days households have spent in temporary accommodation so far, for
    each type of home."
  unit: days
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time. It only counts
    households still in temporary accommodation on that day. A few very long stays pull the average
    up, so the typical (median) figure is often a better guide."
  source_detail: "MHCLG TA7, mean days. Same notes as the median."
- name: ta_children_under_18
  label: Under-18s in TA (second count)
  definition: "The number of people aged under 18 in temporary accommodation, from a separate government
    table."
  unit: children
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time. It differs slightly
    from the main count of children in temporary accommodation. We show both as published."
  source_detail: "MHCLG TA8. Not reconciled with 'children in TA' in TA1."
- name: ta_children_by_age
  label: Under-18s in TA by age
  definition: "People aged under 18 in temporary accommodation, split by each year of age from 0 to 17."
  unit: children
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time. Far fewer babies
    (under 1) are recorded than children of other ages, in every London borough: across all boroughs
    2,021 babies compared with 4,619 two-year-olds (Newham: 130 compared with 506). The source doesn't
    say why, so treat the figures for babies with care."
  source_detail: "MHCLG TA8, single year of age 0 to 17."
- name: housing_register_households
  label: Households on the social housing waiting list
  definition: "Households on the council's waiting list for social housing (the housing register),
    each year from 2012 to 2025."
  unit: households
  source_id: mhclg_lt600_2025
  caveats: "The waiting list isn't an exact count of households in need. Councils review their lists at
    different times, and some households are on more than one list. Some figures were estimated by the
    government where a council didn't send them. Figures for 2018 and earlier are for 1 April rather
    than 31 March. Big jumps from one year to the next (for example Brent from 2020 to 2021, and
    Lambeth from 2024 to 2025) look like changes to how the council runs its list, so compare boroughs
    with care."
  source_detail: "MHCLG Live Table 600, table note 1. 'Estimated' values imputed by MHCLG."
- name: social_lettings_total
  label: Social homes let to new tenants
  definition: "All social homes let to new tenants during the year (April to March). This includes
    homes let by councils and housing associations, at social, affordable and intermediate rents, and
    both ordinary and supported housing."
  unit: lettings
  source_id: mhclg_core_tenancies_2425
  caveats: "These are the figures as councils and landlords reported them, without adjustment.
    Barnet, Camden, Greenwich and Wandsworth didn't send their 2024/25 data, so their figures are too
    low and any ranking that includes them is unreliable."
  source_detail: "CORE Table 1d (unweighted). Table note 10 lists councils that did not submit."
- name: social_lettings_by_type
  label: Social homes let to new tenants, by type of tenancy and landlord
  definition: "Social homes let to new tenants, split by the type of rent (social, affordable or
    intermediate), whether it is ordinary or supported housing, and whether the landlord is a council
    or a housing association."
  unit: lettings
  source_id: mhclg_core_tenancies_2425
  caveats: "These are the figures as councils and landlords reported them, without adjustment.
    Barnet, Camden, Greenwich and Wandsworth didn't send their 2024/25 data, so their figures (and
    especially their council lettings) are too low, and any ranking that includes them is unreliable."
  source_detail: "CORE Table 1d: SR social rent, AR affordable rent, IR intermediate rent; general needs
    or supported; LA or PRP landlord. Table note 10."
- name: social_relet_rent_weekly
  label: Average weekly social rent (homes let to new tenants)
  definition: "The average weekly rent for social homes let again to a new tenant during the year."
  unit: gbp_per_week
  source_id: mhclg_core_tenancies_2425
  caveats: "2024/25 only. The average is calculated in a way that reduces the effect of a few very high
    rents. These are the figures as reported, without adjustment. Barnet, Camden, Greenwich and
    Wandsworth didn't send their 2024/25 data, so their figures are unreliable."
  source_detail: "CORE Table 1e, geometric mean (note 15). Unweighted. Table note 10."
- name: market_rent_weekly
  label: Average weekly private rent
  definition: "The average weekly rent for a privately rented home in the same borough."
  unit: gbp_per_week
  source_id: mhclg_core_tenancies_2425
  caveats: "2024/25 only. It isn't matched to the social rent by number of bedrooms, so the two
    averages may cover different sizes of home."
  source_detail: "ONS Price Index of Private Rents, as used in CORE Table 1e (geometric mean)."
- name: social_rent_pct_of_market_rent
  label: Social rent as a share of private rent
  definition: "The average social rent as a percentage of the average private rent. For example, 50%
    means social rent is half the private rent."
  unit: percent
  source_id: mhclg_core_tenancies_2425
  caveats: "2024/25 only. The averages aren't matched by size of home."
  source_detail: "CORE Table 1e: average social re-let rent divided by average market rent."
- name: social_relets
  label: Social homes let again to a new tenant
  definition: "Existing social homes that became free and were let to a new tenant during the year."
  unit: lettings
  source_id: mhclg_core_tenancies_2425
  caveats: "2024/25 only. These are the figures as reported, without adjustment. Barnet, Camden,
    Greenwich and Wandsworth didn't send their 2024/25 data, so their figures are too low and any
    ranking that includes them is unreliable."
  source_detail: "CORE Table 1e, re-lets. Unweighted. Table note 10."
- name: social_stock_1_april
  label: Total number of social homes on 1 April
  definition: "The total number of social homes in the borough at the start of the year."
  unit: homes
  source_id: mhclg_core_tenancies_2425
  caveats: "2024/25 only."
  source_detail: "Regulator of Social Housing data return and MHCLG Live Table 116, as used in CORE
    Table 1e."
- name: social_relet_rate
  label: Share of social homes let to a new tenant
  definition: "Social homes let again to a new tenant during the year, as a percentage of all social
    homes in the borough. It shows how often a social home becomes free."
  unit: percent
  source_id: mhclg_core_tenancies_2425
  caveats: "2024/25 only. Barnet, Camden, Greenwich and Wandsworth didn't send their data, so their low
    figures aren't reliable."
  source_detail: "CORE Table 1e: re-lets divided by social stock (churn)."
- name: ta_households_out_of_area_per_1000
  label: Households in TA housed outside their borough, per 1,000 households
  definition: "Out of every 1,000 households in the borough, how many the council has placed in
    temporary accommodation in another council's area."
  unit: per_1000_households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time. It may include a few
    households the council must help but hasn't yet found a place for."
  source_detail: "MHCLG TA9 published rate. Note 36 applies."
- name: ta_out_of_area_by_destination
  label: Households in TA outside their borough, by region
  definition: "Households placed in temporary accommodation in another council's area, split by the
    region they were sent to."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time. The regions don't add
    up exactly to the total, because a few households have no destination recorded, so we don't show
    percentages."
  source_detail: "MHCLG TA9, destination region."
- name: ta_out_of_area_by_accommodation_type
  label: Households in TA outside their borough, by type of home
  definition: "Households placed in temporary accommodation in another council's area, split by the type
    of home. Also includes households the council must help but hasn't yet found a place for."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time."
  source_detail: "MHCLG TA9_TATYPE, including duty owed with no accommodation secured."
- name: ta_out_of_area_by_composition
  label: Households in TA outside their borough, by type of household
  definition: "Households placed in temporary accommodation in another council's area, split by who
    lives in them."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This is a count on a single day, 31 March 2026, not a trend over time."
  source_detail: "MHCLG TA9_HHTYPE."
- name: relief_end_decisions_total
  label: Decisions on whether the council must house a household
  definition: "Households who got a decision during the three months on whether the council must house
    them long term (the main duty). This decision comes after a first period in which the council
    tries to help them find a home."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This counts what happened over three months (January to March 2026). Numbers for a single
    borough are small and can change a lot from one quarter to the next. London and England totals are
    rounded to the nearest 10."
  source_detail: "MHCLG MD1: main duty decisions at the end of the s189B relief duty, eligible
    households."
- name: relief_end_decisions
  label: Decisions on whether the council must house a household, by outcome
  definition: "The outcome of those decisions: accepted (the household qualifies and didn't make itself
    homeless), judged to have made itself homeless, doesn't qualify as a priority, or not homeless."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This counts what happened over three months (January to March 2026). Numbers for a single
    borough are small and can change a lot from one quarter to the next. London and England totals are
    rounded to the nearest 10."
  source_detail: "MHCLG MD1: accepted (priority need, unintentionally homeless), intentionally homeless,
    no priority need, not homeless."
- name: main_duty_ended_total
  label: Households whose case was closed (main duty ended)
  definition: "Households whose case the council closed during the three months, so it no longer has to
    house them. This is the main way households leave temporary accommodation."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This counts what happened over three months (January to March 2026). Numbers for a single
    borough are small and can change a lot from one quarter to the next. London and England totals are
    rounded to the nearest 10."
  source_detail: "MHCLG MD2: main duty ended."
- name: main_duty_ended_by_reason
  label: Households whose case was closed, by reason
  definition: "Why the council closed the case: the household accepted or refused a social home,
    accepted or refused a private rented home, refused temporary accommodation or lost contact, was no
    longer eligible, was judged to have made itself homeless from temporary accommodation, left of its
    own accord, or the reason isn't known."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This counts what happened over three months (January to March 2026). Numbers for a single
    borough are small and can change a lot from one quarter to the next. London and England totals are
    rounded to the nearest 10. A case closing isn't the same as a household moving out on that date,
    and one quarter can be unusual."
  source_detail: "MHCLG MD2: Part 6 (social housing) offer accepted or refused, private rented sector
    offer accepted or refused, refused TA or lost contact, ceased eligible, intentionally homeless from
    TA, voluntarily left TA, not known."
- name: main_duty_owed_total
  label: Households the council must house (main duty)
  definition: "Households the council agreed during the three months that it must house until it can
    offer them a settled home."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This counts what happened over three months (January to March 2026). Numbers for a single
    borough are small and can change a lot from one quarter to the next. London and England totals are
    rounded to the nearest 10."
  source_detail: "MHCLG MD3: households owed a main (s193) duty in the quarter."
- name: main_duty_owed_by_priority_need
  label: Households the council must house, by main reason they qualified
  definition: "Households the council newly agreed it must house, split by the main reason they
    qualified (their 'priority need'): they have children, they have children but qualified for another
    reason, pregnancy, vulnerability, or an emergency such as a fire or flood."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This counts what happened over three months (January to March 2026). Numbers for a single
    borough are small and London and England totals are rounded to the nearest 10. 'Pregnant' only
    counts households where pregnancy was the main reason recorded. A pregnant woman who already has
    children is usually recorded under 'has children', so this undercounts pregnant households. It
    counts newly accepted households, not everyone in temporary accommodation."
  source_detail: "MHCLG MD3, priority need: dependent children, children but other priority need,
    pregnant woman, vulnerable, emergency."
- name: main_duty_owed_vulnerable_detail
  label: "Households the council must house because they are vulnerable, by reason"
  definition: "Households that qualified because they are vulnerable, split by the reason: old age,
    physical disability or ill health, mental health, being a young applicant, domestic abuse, or
    other."
  unit: households
  source_id: mhclg_la_detailed_2026q1
  caveats: "This counts what happened over three months (January to March 2026). Numbers for a single
    borough are small and can change a lot from one quarter to the next. London and England totals are
    rounded to the nearest 10."
  source_detail: "MHCLG MD3, 'vulnerable' priority need breakdown."
- name: ta_households_avg4q
  label: Households in TA (yearly average)
  definition: "Households in temporary accommodation, averaged over the four quarters of each year.
    Available for London from 2002 to 2025, and for each borough for 2025."
  unit: households
  source_id: tfl_lpp_t87_2026
  caveats: "This is an average over the year, not a count on a single day, so don't compare it directly
    with the 31 March 2026 figures. Borough figures seem to be rounded to the nearest 10; for London in
    2025 we use the unrounded figure."
