[project]
name = "ta-london"
version = "0.1.0"
description = "Temporary accommodation for families in London: Newham case study"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pyarrow",
    "openpyxl",
    "odfpy",
    "pandera",
    "plotly",
    "geopandas",
    "streamlit",
    "pyyaml",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "jupyterlab",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ta_london"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
